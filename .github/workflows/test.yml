name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  action:
    # The action itself, on a report that already exists: no email is sent
    # and no test address is reserved.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          slug: zc7p5mkukizvlrne62xf
          min-score: 50
      - shell: bash
        run: |
          test "${{ steps.check.outputs.passed }}" = true
          test -n "${{ steps.check.outputs.score }}"
          echo "score ${{ steps.check.outputs.score }}, report ${{ steps.check.outputs.report-url }}"
